<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💕 Una domanda per te 💕</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #0a0000;
            font-family: 'Quicksand', sans-serif;
            cursor: default;
        }

        /* ===== INTRO CINEMATIC ===== */
        .intro-overlay {
            position: fixed;
            inset: 0;
            background: #0a0000;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            transition: opacity 1.5s ease, visibility 1.5s ease;
            cursor: pointer;
        }

        .intro-overlay.fade-out {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .intro-text {
            color: #ff1744;
            font-family: 'Dancing Script', cursive;
            font-size: 2.5em;
            opacity: 0;
            transform: translateY(20px);
            animation: introFadeIn 2s ease 0.5s forwards;
        }

        .intro-subtext {
            color: rgba(255, 255, 255, 0.5);
            font-size: 1em;
            margin-top: 15px;
            opacity: 0;
            animation: introFadeIn 1.5s ease 2s forwards;
            letter-spacing: 3px;
        }

        .intro-heart {
            font-size: 3em;
            opacity: 0;
            animation: introHeartBeat 1.5s ease 1.2s forwards;
            margin-bottom: 20px;
        }

        @keyframes introFadeIn {
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes introHeartBeat {
            0% { opacity: 0; transform: scale(0); }
            50% { opacity: 1; transform: scale(1.3); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* ===== SFONDO CINEMATOGRAFICO ===== */
        .cinematic-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
        }

        .bg-gradient {
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(ellipse at 30% 50%, rgba(180, 0, 30, 0.4) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 50%, rgba(120, 0, 40, 0.3) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 100%, rgba(200, 0, 50, 0.2) 0%, transparent 50%),
                linear-gradient(180deg, #0a0000 0%, #1a0005 30%, #2a000a 60%, #0a0000 100%);
            animation: bgPulse 8s ease-in-out infinite alternate;
        }

        @keyframes bgPulse {
            0% { filter: brightness(0.8); }
            100% { filter: brightness(1.2); }
        }

        /* Bokeh particles */
        .bokeh {
            position: absolute;
            border-radius: 50%;
            filter: blur(1px);
            animation: bokehFloat linear infinite;
            opacity: 0;
        }

        @keyframes bokehFloat {
            0% { transform: translateY(110vh) scale(0); opacity: 0; }
            10% { opacity: var(--max-opacity); }
            90% { opacity: var(--max-opacity); }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        /* Ambient light rays */
        .light-rays {
            position: absolute;
            inset: 0;
            background: 
                conic-gradient(from 0deg at 50% 120%, 
                    transparent 0deg, 
                    rgba(255, 23, 68, 0.03) 10deg,
                    transparent 20deg,
                    rgba(255, 23, 68, 0.02) 40deg,
                    transparent 50deg,
                    rgba(255, 23, 68, 0.03) 60deg,
                    transparent 70deg
                );
            animation: raysSpin 30s linear infinite;
            opacity: 0.6;
        }

        @keyframes raysSpin { to { transform: rotate(360deg); } }

        /* Stars */
        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: starTwinkle ease-in-out infinite;
        }

        @keyframes starTwinkle {
            0%, 100% { opacity: 0.2; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.5); }
        }

        /* ===== FLOATING HEARTS ===== */
        .hearts-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .floating-heart {
            position: absolute;
            pointer-events: none;
            opacity: 0;
            animation: heartRise linear infinite;
            filter: blur(0.5px);
            text-shadow: 0 0 15px rgba(255, 50, 80, 0.5);
        }

        @keyframes heartRise {
            0% { transform: translateY(105vh) translateX(0) rotate(0deg) scale(0.3); opacity: 0; }
            5% { opacity: 0.7; }
            50% { transform: translateY(50vh) translateX(var(--sway)) rotate(180deg) scale(0.8); opacity: 0.7; }
            95% { opacity: 0.3; }
            100% { transform: translateY(-5vh) translateX(calc(var(--sway) * -1)) rotate(360deg) scale(1); opacity: 0; }
        }

        /* ===== LETTERBOX CINEMATIC ===== */
        .letterbox-top, .letterbox-bottom {
            position: fixed;
            left: 0;
            right: 0;
            height: 60px;
            background: #000;
            z-index: 5;
            transition: height 1s ease;
        }

        .letterbox-top { top: 0; }
        .letterbox-bottom { bottom: 0; }
        .letterbox-top.expand, .letterbox-bottom.expand { height: 0; }

        /* ===== MAIN STAGE ===== */
        .stage {
            position: fixed;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
            opacity: 0;
            transition: opacity 2s ease;
        }

        .stage.visible { opacity: 1; }

        .main-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            max-width: 700px;
            width: 100%;
            padding: 50px 40px;
        }

        /* ===== CHARACTERS ===== */
        .characters {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .character {
            position: relative;
            transition: all 1.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .character-frame {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            overflow: hidden;
            position: relative;
            box-shadow: 
                0 0 30px rgba(255, 23, 68, 0.3),
                0 0 60px rgba(255, 23, 68, 0.15),
                inset 0 0 20px rgba(0,0,0,0.3);
            border: 3px solid rgba(255, 23, 68, 0.6);
            transition: all 1.5s ease;
        }

        .character-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .character:hover .character-frame img { transform: scale(1.08); }

        /* Glow rings */
        .glow-ring {
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            border: 2px solid transparent;
            border-top-color: rgba(255, 23, 68, 0.5);
            border-right-color: rgba(255, 100, 150, 0.3);
            animation: glowSpin 3s linear infinite;
        }

        .glow-ring-2 {
            animation: glowSpin 4s linear infinite reverse;
            border-top-color: rgba(255, 150, 180, 0.3);
            border-left-color: rgba(255, 23, 68, 0.4);
            inset: -14px;
        }

        @keyframes glowSpin { to { transform: rotate(360deg); } }

        /* Character entrance */
        .character.koala {
            opacity: 0;
            transform: translateX(-80px);
            animation: charEnterLeft 1.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s forwards;
        }

        .character.bunny {
            opacity: 0;
            transform: translateX(80px);
            animation: charEnterRight 1.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.6s forwards;
        }

        @keyframes charEnterLeft { to { opacity: 1; transform: translateX(0); } }
        @keyframes charEnterRight { to { opacity: 1; transform: translateX(0); } }

        /* Heart between */
        .heart-connector {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 60px;
            height: 60px;
        }

        .heart-main {
            font-size: 40px;
            filter: drop-shadow(0 0 20px rgba(255, 23, 68, 0.6));
            opacity: 0;
            animation: heartAppear 1s ease 1.2s forwards, heartPulse 1.5s ease-in-out 2.2s infinite;
        }

        @keyframes heartAppear {
            0% { opacity: 0; transform: scale(0) rotate(-20deg); }
            100% { opacity: 1; transform: scale(1) rotate(0deg); }
        }

        @keyframes heartPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.25); }
        }

        /* TOGETHER STATE */
        .characters.together .koala {
            transform: translateX(40px) !important;
            animation: none;
            opacity: 1;
        }

        .characters.together .bunny {
            transform: translateX(-40px) !important;
            animation: none;
            opacity: 1;
        }

        .characters.together .character-frame {
            box-shadow: 
                0 0 50px rgba(255, 23, 68, 0.5),
                0 0 100px rgba(255, 23, 68, 0.25),
                0 0 150px rgba(255, 23, 68, 0.1);
            border-color: rgba(255, 100, 150, 0.8);
        }

        .characters.together .heart-main {
            animation: heartExplode 0.8s ease forwards, heartPulseIntense 0.6s ease-in-out 0.8s infinite !important;
            font-size: 50px;
        }

        @keyframes heartExplode {
            0% { transform: scale(1); filter: drop-shadow(0 0 20px rgba(255, 23, 68, 0.6)); }
            50% { transform: scale(2); filter: drop-shadow(0 0 60px rgba(255, 23, 68, 1)); }
            100% { transform: scale(1.3); filter: drop-shadow(0 0 40px rgba(255, 23, 68, 0.8)); }
        }

        @keyframes heartPulseIntense {
            0%, 100% { transform: scale(1.3); }
            50% { transform: scale(1.6); }
        }

        /* ===== TYPEWRITER TEXT ===== */
        .text-area {
            text-align: center;
            min-height: 100px;
        }

        .typewriter-line {
            color: rgba(255, 255, 255, 0.85);
            font-size: 1.3em;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
            min-height: 1.6em;
            text-shadow: 0 0 30px rgba(255, 23, 68, 0.3);
        }

        .typewriter-main {
            font-family: 'Dancing Script', cursive;
            font-size: 2.8em;
            color: #ff1744;
            text-shadow: 
                0 0 30px rgba(255, 23, 68, 0.5),
                0 0 60px rgba(255, 23, 68, 0.2);
            min-height: 1.4em;
            margin-top: 8px;
        }

        .typewriter-cursor {
            display: inline-block;
            width: 3px;
            height: 1em;
            background: #ff1744;
            margin-left: 3px;
            animation: blink 0.8s step-end infinite;
            vertical-align: text-bottom;
        }

        @keyframes blink { 50% { opacity: 0; } }

        /* ===== BUTTONS ===== */
        .buttons-area {
            display: flex;
            gap: 40px;
            margin-top: 15px;
            opacity: 0;
            transform: translateY(30px);
            transition: all 1s ease;
        }

        .buttons-area.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .btn {
            padding: 20px 70px;
            font-size: 1.4em;
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            border: none;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        .btn-yes {
            background: linear-gradient(135deg, #ff1744, #e91e63, #ff1744);
            background-size: 200% 200%;
            animation: yesGlow 3s ease infinite;
            color: white;
            box-shadow: 
                0 5px 30px rgba(255, 23, 68, 0.4),
                0 0 60px rgba(255, 23, 68, 0.15);
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        @keyframes yesGlow {
            0%, 100% { background-position: 0% 50%; box-shadow: 0 5px 30px rgba(255, 23, 68, 0.4), 0 0 60px rgba(255, 23, 68, 0.15); }
            50% { background-position: 100% 50%; box-shadow: 0 5px 40px rgba(255, 23, 68, 0.6), 0 0 80px rgba(255, 23, 68, 0.25); }
        }

        .btn-yes::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 62px;
            background: linear-gradient(135deg, #ff1744, #ff6090, #ff1744);
            z-index: -1;
            animation: borderRotate 3s linear infinite;
            opacity: 0.5;
        }

        @keyframes borderRotate { to { transform: rotate(360deg); } }

        .btn-yes:hover {
            transform: scale(1.12);
            box-shadow: 0 10px 50px rgba(255, 23, 68, 0.6), 0 0 100px rgba(255, 23, 68, 0.3);
        }

        /* ===== NO BUTTON - STILE DESKTOP ===== */
        .btn-no {
            background: rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            transition: none !important;
            pointer-events: auto;
            z-index: 50;
        }

        /* Scia del pulsante NO */
        .no-trail {
            position: fixed;
            pointer-events: none;
            z-index: 49;
            border-radius: 50%;
            animation: trailFade 0.6s ease-out forwards;
        }

        @keyframes trailFade {
            0% { opacity: 0.6; transform: scale(1); }
            100% { opacity: 0; transform: scale(0.2); }
        }

        /* Poof quando NO scappa */
        .poof {
            position: fixed;
            pointer-events: none;
            z-index: 49;
            font-size: 20px;
            animation: poofAway 0.8s ease-out forwards;
        }

        @keyframes poofAway {
            0% { opacity: 1; transform: translate(0, 0) scale(1); }
            100% { opacity: 0; transform: translate(var(--px), var(--py)) scale(0); }
        }

        /* ===== ESCAPE MESSAGE ===== */
        .escape-message {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: rgba(20, 0, 5, 0.9);
            color: #ff4081;
            padding: 15px 35px;
            border-radius: 50px;
            font-size: 1.15em;
            font-weight: 600;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 200;
            border: 1px solid rgba(255, 23, 68, 0.3);
            box-shadow: 0 10px 40px rgba(0,0,0,0.5), 0 0 30px rgba(255, 23, 68, 0.15);
            pointer-events: none;
            backdrop-filter: blur(20px);
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .escape-message.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ===== CELEBRATION ===== */
        .celebration-content {
            text-align: center;
            opacity: 0;
            transform: translateY(40px);
            transition: all 1.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
            position: absolute;
            width: 100%;
        }

        .celebration-content.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
            position: relative;
        }

        .celeb-title {
            font-family: 'Dancing Script', cursive;
            font-size: 3.5em;
            color: #ff1744;
            text-shadow: 0 0 40px rgba(255, 23, 68, 0.6), 0 0 80px rgba(255, 23, 68, 0.3);
            margin-bottom: 15px;
        }

        .celeb-text {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1.3em;
            line-height: 2;
            font-weight: 600;
            text-shadow: 0 0 20px rgba(255, 23, 68, 0.2);
        }

        .celeb-text .pink { color: #ff4081; }

        /* ===== CONFETTI ===== */
        .confetti-piece {
            position: fixed;
            z-index: 200;
            pointer-events: none;
            animation: confettiDrop linear forwards;
        }

        @keyframes confettiDrop {
            0% { transform: translateY(-10vh) rotate(0deg) scale(1); opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translateY(105vh) rotate(var(--rot)) scale(0.5); opacity: 0; }
        }

        /* Heart burst */
        .heart-burst {
            position: fixed;
            pointer-events: none;
            z-index: 150;
            animation: burstAway ease-out forwards;
        }

        @keyframes burstAway {
            0% { transform: translate(0, 0) scale(0); opacity: 1; }
            30% { opacity: 1; transform: translate(calc(var(--bx) * 0.3), calc(var(--by) * 0.3)) scale(1.2); }
            100% { transform: translate(var(--bx), var(--by)) scale(0.3); opacity: 0; }
        }

        /* Vignette */
        .vignette {
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.6) 100%);
            pointer-events: none;
            z-index: 3;
        }

        /* Ambient particles */
        .ambient-particle {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
            animation: ambientDrift linear infinite;
            filter: blur(0.5px);
        }

        @keyframes ambientDrift {
            0% { transform: translate(0, 0); opacity: 0; }
            20% { opacity: 0.6; }
            80% { opacity: 0.6; }
            100% { transform: translate(var(--dx), var(--dy)); opacity: 0; }
        }

        /* Screen flash */
        .screen-flash {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, rgba(255, 23, 68, 0.4), transparent 70%);
            z-index: 10;
            opacity: 0;
            pointer-events: none;
        }

        .screen-flash.flash {
            animation: flashPulse 1.5s ease forwards;
        }

        @keyframes flashPulse {
            0% { opacity: 0; }
            15% { opacity: 1; }
            100% { opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- INTRO CINEMATICO -->
    <div class="intro-overlay" id="intro">
        <div class="intro-heart">🩷</div>
        <div class="intro-text">Ho qualcosa da chiederti...</div>
        <div class="intro-subtext">▶ CLICCA PER CONTINUARE</div>
    </div>

    <!-- SFONDO -->
    <div class="cinematic-bg">
        <div class="bg-gradient"></div>
        <div class="light-rays"></div>
        <div class="stars-layer" id="stars"></div>
    </div>

    <!-- BOKEH -->
    <div id="bokehContainer"></div>

    <!-- CUORICINI -->
    <div class="hearts-container" id="hearts"></div>

    <!-- PARTICELLE AMBIENT -->
    <div id="ambientContainer"></div>

    <!-- VIGNETTE -->
    <div class="vignette"></div>

    <!-- LETTERBOX -->
    <div class="letterbox-top" id="lbTop"></div>
    <div class="letterbox-bottom" id="lbBottom"></div>

    <!-- FLASH -->
    <div class="screen-flash" id="screenFlash"></div>

    <!-- MESSAGGIO ESCAPE -->
    <div class="escape-message" id="escapeMsg"></div>

    <!-- MAIN STAGE -->
    <div class="stage" id="stage">
        <div class="main-card">
            
            <div class="characters" id="characters">
                <div class="character koala">
                    <div class="glow-ring"></div>
                    <div class="glow-ring glow-ring-2"></div>
                    <div class="character-frame">
                        <img src="https://i.imgur.com/57Zp6wD.jpeg" alt="Koala">
                    </div>
                </div>

                <div class="heart-connector">
                    <div class="heart-main" id="heartMain">💕</div>
                </div>

                <div class="character bunny">
                    <div class="glow-ring"></div>
                    <div class="glow-ring glow-ring-2"></div>
                    <div class="character-frame">
                        <img src="https://i.imgur.com/odRmy9X.jpeg" alt="Coniglietta">
                    </div>
                </div>
            </div>

            <div class="text-area" id="textArea">
                <div class="typewriter-line" id="line1"></div>
                <div class="typewriter-main" id="line2"></div>
            </div>

            <div class="buttons-area" id="buttonsArea">
                <button class="btn btn-yes" id="yesBtn">SÌ! 💕</button>
                <button class="btn btn-no" id="noBtn">No...</button>
            </div>

            <div class="celebration-content" id="celebration">
                <div class="celeb-title">SIIIII! 🎉🩷🩷🎉</div>
                <div class="celeb-text">
                    Lo sapevo <span class="pink">🩷</span><br>
                    Ti amo more than tantissimo <span class="pink">🩷</span><br><br>
                    Sarà un San Valentino<br>bellissimo <span class="pink">🩷</span>
                </div>
            </div>

        </div>
    </div>

    <script>
        // ============ ELEMENTI ============
        const intro = document.getElementById('intro');
        const stage = document.getElementById('stage');
        const lbTop = document.getElementById('lbTop');
        const lbBottom = document.getElementById('lbBottom');
        const line1 = document.getElementById('line1');
        const line2 = document.getElementById('line2');
        const buttonsArea = document.getElementById('buttonsArea');
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const escapeMsg = document.getElementById('escapeMsg');
        const characters = document.getElementById('characters');
        const heartMain = document.getElementById('heartMain');
        const celebration = document.getElementById('celebration');
        const textArea = document.getElementById('textArea');
        const screenFlash = document.getElementById('screenFlash');

        // ============ STELLE ============
        (function() {
            const c = document.getElementById('stars');
            for (let i = 0; i < 80; i++) {
                const s = document.createElement('div');
                s.className = 'star';
                s.style.left = Math.random() * 100 + '%';
                s.style.top = Math.random() * 100 + '%';
                s.style.animationDuration = (2 + Math.random() * 4) + 's';
                s.style.animationDelay = Math.random() * 3 + 's';
                s.style.width = s.style.height = (1 + Math.random() * 2) + 'px';
                c.appendChild(s);
            }
        })();

        // ============ BOKEH ============
        (function() {
            const c = document.getElementById('bokehContainer');
            for (let i = 0; i < 20; i++) {
                const b = document.createElement('div');
                b.className = 'bokeh';
                const size = 5 + Math.random() * 25;
                b.style.width = size + 'px';
                b.style.height = size + 'px';
                b.style.left = Math.random() * 100 + '%';
                b.style.background = `radial-gradient(circle, 
                    rgba(255,${50+Math.random()*100},${80+Math.random()*80},${0.2+Math.random()*0.3}), 
                    transparent)`;
                b.style.setProperty('--max-opacity', (0.2 + Math.random() * 0.4).toString());
                b.style.animationDuration = (8 + Math.random() * 12) + 's';
                b.style.animationDelay = Math.random() * 10 + 's';
                c.appendChild(b);
            }
        })();

        // ============ AMBIENT PARTICLES ============
        function createAmbientParticle() {
            const c = document.getElementById('ambientContainer');
            const p = document.createElement('div');
            p.className = 'ambient-particle';
            p.style.left = Math.random() * 100 + '%';
            p.style.top = Math.random() * 100 + '%';
            p.style.setProperty('--dx', (Math.random()-0.5)*200 + 'px');
            p.style.setProperty('--dy', (Math.random()-0.5)*200 + 'px');
            p.style.animationDuration = (5 + Math.random() * 10) + 's';
            p.style.background = `rgba(255,${23+Math.random()*100},${68+Math.random()*80},${0.3+Math.random()*0.4})`;
            p.style.width = p.style.height = (2 + Math.random() * 3) + 'px';
            c.appendChild(p);
            setTimeout(() => p.remove(), 15000);
        }
        setInterval(createAmbientParticle, 600);

        // ============ CUORICINI ============
        const heartEmojis = ['💕','💖','💗','💓','💝','❤️','🩷','🤍','💘'];
        
        function createHeart() {
            const c = document.getElementById('hearts');
            const h = document.createElement('div');
            h.className = 'floating-heart';
            h.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
            h.style.left = Math.random() * 100 + '%';
            h.style.setProperty('--sway', (Math.random()-0.5)*150 + 'px');
            const dur = 6 + Math.random() * 6;
            h.style.animationDuration = dur + 's';
            h.style.fontSize = (14 + Math.random() * 20) + 'px';
            c.appendChild(h);
            setTimeout(() => h.remove(), dur * 1000 + 500);
        }

        setInterval(createHeart, 800);
        for (let i = 0; i < 6; i++) setTimeout(createHeart, i * 300);

        // ============ TYPEWRITER ============
        function typeWriter(el, text, speed = 70) {
            return new Promise(resolve => {
                let i = 0;
                el.textContent = '';
                const cursor = document.createElement('span');
                cursor.className = 'typewriter-cursor';
                el.appendChild(cursor);
                function type() {
                    if (i < text.length) {
                        el.textContent = text.substring(0, i + 1);
                        el.appendChild(cursor);
                        i++;
                        setTimeout(type, speed + Math.random() * 40);
                    } else {
                        setTimeout(() => { cursor.remove(); resolve(); }, 500);
                    }
                }
                type();
            });
        }

        function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

        // ============ INTRO ============
        intro.addEventListener('click', startExperience);

        async function startExperience() {
            intro.classList.add('fade-out');
            await sleep(1000);
            stage.classList.add('visible');
            lbTop.classList.add('expand');
            lbBottom.classList.add('expand');
            await sleep(1500);
            await typeWriter(line1, 'Ciao amore mio! 💖', 80);
            await sleep(600);
            await typeWriter(line2, 'Vuoi essere la mia Valentina?', 65);
            await sleep(800);
            buttonsArea.classList.add('visible');
        }

        // ============================================
        //     🏃 PULSANTE NO CHE SCAPPA (DESKTOP)
        // ============================================
        
        const escapeMessages = [
            "Hey, quel pulsante NO sta scappando 💨",
            "Il NO è un po' timido 🫣",
            "Ops, è scivolato 🤷🏻",
            "Dai su, lo sai che mi ami 🩷",
            "Non è un'opzione valida 😠",
            "Quasi preso! Ma no 😏...",
            "Koalino ti implora...🩷",
            "La coniglietta dice SÌ! 🐰🎀",
            "Quel bottone ha le gambe 🦵🏻",
            "Arrendersi è l'unica via 🩷",
            "Sei veloce, ma lui di più ⚡",
            "Hannika ti odierebbe 🐶"
        ];

        const noTexts = [
            "No...", "Nope!", "Mai!", "🏃💨",
            "Scappo!", "Ahah!", "Ciao!", "Nah!",
            "❌", "Prova!", "Troppo lenta!", "Nope 😜"
        ];

        let msgIndex = 0;
        let escapeCount = 0;
        let msgTimeout = null;
        let isEscaping = false;

        function escapeButton(e) {
            if (e) { e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation(); }
            if (isEscaping) return;
            isEscaping = true;

            escapeCount++;

            // Salva posizione corrente per la scia
            const oldRect = noBtn.getBoundingClientRect();
            const oldX = oldRect.left;
            const oldY = oldRect.top;

            // Mostra messaggio
            if (msgTimeout) clearTimeout(msgTimeout);
            escapeMsg.textContent = escapeMessages[msgIndex % escapeMessages.length];
            escapeMsg.classList.add('show');
            msgIndex++;
            msgTimeout = setTimeout(() => escapeMsg.classList.remove('show'), 2200);

            // Calcola nuova posizione (lontana dalla attuale E dal SÌ)
            const bw = noBtn.offsetWidth || 150;
            const bh = noBtn.offsetHeight || 55;
            const margin = 50;
            const maxX = window.innerWidth - bw - margin;
            const maxY = window.innerHeight - bh - margin;

            let newX, newY, attempts = 0;
            do {
                newX = margin + Math.random() * (maxX - margin);
                newY = margin + 50 + Math.random() * (maxY - margin - 50);
                attempts++;
            } while (attempts < 30 && (isNearYes(newX, newY) || isTooClose(newX, newY, oldX, oldY)));

            // Crea scia di particelle dalla vecchia alla nuova posizione
            createEscapeTrail(oldX, oldY, newX, newY);

            // Crea poof nella vecchia posizione
            createPoof(oldX + bw/2, oldY + bh/2);

            // Muovi il pulsante
            noBtn.style.position = 'fixed';
            noBtn.style.left = newX + 'px';
            noBtn.style.top = newY + 'px';
            noBtn.style.zIndex = '50';

            // Cambia testo
            noBtn.textContent = noTexts[Math.floor(Math.random() * noTexts.length)];

            // Rimpicciolisce dopo tanti tentativi
            if (escapeCount > 4) {
                const s = Math.max(0.45, 1 - escapeCount * 0.07);
                noBtn.style.transform = 'scale(' + s + ')';
                noBtn.style.opacity = Math.max(0.3, 1 - escapeCount * 0.06);
            }

            // Sblocca dopo un breve delay
            setTimeout(() => { isEscaping = false; }, 100);
        }

        function isNearYes(x, y) {
            const r = yesBtn.getBoundingClientRect();
            return Math.hypot(x - r.left, y - r.top) < 200;
        }

        function isTooClose(x1, y1, x2, y2) {
            return Math.hypot(x1 - x2, y1 - y2) < 150;
        }

        // Scia di particelle
        function createEscapeTrail(x1, y1, x2, y2) {
            const steps = 8;
            for (let i = 0; i < steps; i++) {
                setTimeout(() => {
                    const t = i / steps;
                    const x = x1 + (x2 - x1) * t;
                    const y = y1 + (y2 - y1) * t;

                    const trail = document.createElement('div');
                    trail.className = 'no-trail';
                    trail.style.left = x + 'px';
                    trail.style.top = y + 'px';
                    trail.style.width = (8 + Math.random() * 12) + 'px';
                    trail.style.height = trail.style.width;
                    trail.style.background = `radial-gradient(circle, rgba(255,255,255,0.4), rgba(255,100,150,0.2), transparent)`;
                    document.body.appendChild(trail);
                    setTimeout(() => trail.remove(), 700);
                }, i * 25);
            }
        }

        // Poof (nuvola di fumo) quando scappa
        function createPoof(cx, cy) {
            const poofEmojis = ['💨', '✨', '💫', '💭'];
            for (let i = 0; i < 6; i++) {
                const p = document.createElement('div');
                p.className = 'poof';
                p.textContent = poofEmojis[Math.floor(Math.random() * poofEmojis.length)];
                p.style.left = cx + 'px';
                p.style.top = cy + 'px';
                const angle = (i / 6) * Math.PI * 2;
                const dist = 30 + Math.random() * 40;
                p.style.setProperty('--px', Math.cos(angle) * dist + 'px');
                p.style.setProperty('--py', Math.sin(angle) * dist + 'px');
                document.body.appendChild(p);
                setTimeout(() => p.remove(), 900);
            }
        }

        // 🎯 LISTENERS - mouseenter è la chiave!
        noBtn.addEventListener('mouseenter', escapeButton);
        noBtn.addEventListener('mouseover', escapeButton);
        noBtn.addEventListener('pointerdown', e => { e.preventDefault(); escapeButton(e); });
        noBtn.addEventListener('click', e => { e.preventDefault(); escapeButton(e); });
        noBtn.addEventListener('touchstart', e => { e.preventDefault(); escapeButton(e); }, {passive: false});

        // ============ YES - CELEBRATION ============
        let celebrated = false;

        yesBtn.addEventListener('click', e => { e.preventDefault(); triggerCelebration(); });

        async function triggerCelebration() {
            if (celebrated) return;
            celebrated = true;

            screenFlash.classList.add('flash');

            buttonsArea.style.opacity = '0';
            buttonsArea.style.pointerEvents = 'none';
            noBtn.style.display = 'none';
            escapeMsg.classList.remove('show');

            await sleep(300);

            characters.classList.add('together');
            setTimeout(burstHearts, 400);

            await sleep(600);

            textArea.style.transition = 'all 0.8s ease';
            textArea.style.opacity = '0';
            textArea.style.maxHeight = '0';
            textArea.style.overflow = 'hidden';

            await sleep(800);

            celebration.classList.add('show');
            launchConfetti();
            setTimeout(launchConfetti, 1500);
            setTimeout(launchConfetti, 3000);

            for (let i = 0; i < 50; i++) {
                setTimeout(createHeart, i * 60);
            }
        }

        function burstHearts() {
            const rect = characters.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            const emojis = ['💕','💖','💗','🩷','❤️','💓','✨','💘','🤍'];
            for (let i = 0; i < 24; i++) {
                setTimeout(() => {
                    const h = document.createElement('div');
                    h.className = 'heart-burst';
                    h.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                    h.style.fontSize = (18 + Math.random() * 22) + 'px';
                    h.style.left = cx + 'px';
                    h.style.top = cy + 'px';
                    const a = (i/24)*Math.PI*2 + (Math.random()-0.5)*0.3;
                    const d = 100 + Math.random() * 200;
                    h.style.setProperty('--bx', Math.cos(a)*d + 'px');
                    h.style.setProperty('--by', Math.sin(a)*d + 'px');
                    h.style.animationDuration = (1 + Math.random()) + 's';
                    document.body.appendChild(h);
                    setTimeout(() => h.remove(), 2500);
                }, i * 60);
            }
        }

        function launchConfetti() {
            const colors = ['#ff1744','#ff5252','#fff','#ffeb3b','#ff4081','#f50057','#ff80ab','#e91e63','#ffcdd2'];
            const emojis = ['❤️','💕','💖','✨','🎉','💗','🩷','🤍','💘'];
            for (let i = 0; i < 60; i++) {
                setTimeout(() => {
                    const c = document.createElement('div');
                    c.className = 'confetti-piece';
                    if (Math.random() > 0.4) {
                        c.textContent = emojis[Math.floor(Math.random()*emojis.length)];
                        c.style.fontSize = (12 + Math.random()*24) + 'px';
                    } else {
                        c.style.width = (6+Math.random()*12) + 'px';
                        c.style.height = (6+Math.random()*12) + 'px';
                        c.style.background = colors[Math.floor(Math.random()*colors.length)];
                        c.style.borderRadius = Math.random()>0.5 ? '50%' : '2px';
                    }
                    c.style.left = Math.random()*100 + 'vw';
                    c.style.setProperty('--rot', (360+Math.random()*720) + 'deg');
                    c.style.animationDuration = (2.5+Math.random()*2.5) + 's';
                    document.body.appendChild(c);
                    setTimeout(() => c.remove(), 5500);
                }, i * 50);
            }
        }
    </script>
</body>
</html>
