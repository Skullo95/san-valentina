<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>💕 Una domanda per te 💕</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            min-height: -webkit-fill-available;
            background: linear-gradient(135deg, #ff0a3c 0%, #cc0029 50%, #8b0000 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Comic Sans MS', 'Chalkboard', 'Arial Rounded MT Bold', cursive;
            overflow-x: hidden;
            padding: 15px;
        }

        /* Cuoricini fluttuanti */
        .hearts-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .floating-heart {
            position: absolute;
            animation: floatUp linear infinite;
            opacity: 0;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) rotate(0deg) scale(0.5);
                opacity: 0;
            }
            5% {
                opacity: 0.85;
            }
            50% {
                opacity: 0.85;
            }
            95% {
                opacity: 0.3;
            }
            100% {
                transform: translateY(-80px) rotate(360deg) scale(1.1);
                opacity: 0;
            }
        }

        /* Container principale */
        .container {
            background: rgba(255, 255, 255, 0.97);
            border-radius: 25px;
            padding: 30px 25px;
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.3),
                0 0 40px rgba(255, 255, 255, 0.2),
                inset 0 0 30px rgba(255, 192, 203, 0.2);
            text-align: center;
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            border: 4px solid #ff1744;
        }

        /* Animali */
        .animals {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-bottom: 15px;
            position: relative;
        }

        .animal-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ff1744;
            box-shadow: 0 4px 15px rgba(255, 23, 68, 0.3);
            transition: all 1.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .koala-wrap {
            animation: bounce 2s ease-in-out infinite;
            transition: all 1.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .bunny-wrap {
            animation: bounce 2s ease-in-out infinite 0.3s;
            transition: all 1.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .heart-between {
            font-size: 35px;
            animation: pulse 1s ease-in-out infinite;
            transition: all 1s ease;
            z-index: 2;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.4); }
        }

        /* Stato avvicinamento dopo SÌ */
        .animals.together .koala-wrap {
            transform: translateX(25px) !important;
            animation: none;
        }

        .animals.together .bunny-wrap {
            transform: translateX(-25px) !important;
            animation: none;
        }

        .animals.together .heart-between {
            transform: scale(1.6);
            animation: heartBurst 0.6s ease-in-out infinite;
        }

        @keyframes heartBurst {
            0%, 100% { transform: scale(1.4); filter: brightness(1); }
            50% { transform: scale(1.8); filter: brightness(1.2); }
        }

        .animals.together .animal-img {
            box-shadow: 0 0 25px rgba(255, 23, 68, 0.6);
            border-color: #ff4081;
        }

        /* Testo */
        h1 {
            color: #d50000;
            font-size: 1.5em;
            margin-bottom: 25px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
            line-height: 1.5;
        }

        .highlight {
            color: #ff1744;
            font-size: 1.15em;
            display: block;
            margin-top: 10px;
        }

        /* Pulsanti */
        .buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
            min-height: 130px;
            align-items: center;
        }

        .btn {
            padding: 18px 60px;
            font-size: 1.3em;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 6px 25px rgba(0,0,0,0.25);
            min-width: 200px;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
        }

        .btn-yes {
            background: linear-gradient(45deg, #ff1744, #ff5252, #ff1744);
            background-size: 200% 200%;
            animation: gradientShift 2s ease infinite;
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .btn-yes:hover, .btn-yes:active {
            transform: scale(1.1);
            box-shadow: 0 10px 40px rgba(255, 23, 68, 0.5);
        }

        .btn-no {
            background: linear-gradient(45deg, #9e9e9e, #757575);
            color: white;
            font-size: 1.1em;
            padding: 15px 50px;
        }

        /* Celebrazione */
        .celebration {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .celebration.show {
            display: block;
        }

        .question-content {
            transition: opacity 0.5s ease;
        }

        .question-content.hide {
            opacity: 0;
            pointer-events: none;
            max-height: 0;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .celebration h2 {
            font-size: 2em;
            margin-bottom: 5px;
            color: #d50000;
        }

        .love-text {
            font-size: 1.1em;
            color: #d50000;
            margin-top: 15px;
            line-height: 1.8;
        }

        /* Sparkle attorno alle immagini dopo SÌ */
        .sparkle-ring {
            position: absolute;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 2px dashed rgba(255, 23, 68, 0);
            transition: all 1s ease;
            pointer-events: none;
        }

        .animals.together .sparkle-ring-left {
            border-color: rgba(255, 23, 68, 0.4);
            animation: spinSpark 3s linear infinite;
            left: calc(50% - 105px);
            top: 50%;
            transform: translate(-50%, -50%);
        }

        .animals.together .sparkle-ring-right {
            border-color: rgba(255, 23, 68, 0.4);
            animation: spinSpark 3s linear infinite reverse;
            right: calc(50% - 105px);
            top: 50%;
            transform: translate(50%, -50%);
        }

        @keyframes spinSpark {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* Coriandoli */
        .confetti {
            position: fixed;
            animation: confettiFall 3s ease-in-out forwards;
            z-index: 1000;
            pointer-events: none;
        }

        @keyframes confettiFall {
            0% {
                transform: translateY(-20px) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* Messaggio quando il NO scappa */
        .escape-message {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            color: #d50000;
            padding: 12px 20px;
            border-radius: 25px;
            font-size: 0.95em;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 100;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            max-width: 90%;
            text-align: center;
            border: 2px solid #ff1744;
            font-weight: bold;
            pointer-events: none;
        }

        .escape-message.show {
            opacity: 1;
        }

        /* Decorazioni angoli */
        .corner-decoration {
            position: fixed;
            font-size: 40px;
            opacity: 0.6;
            z-index: 0;
            animation: twinkle 2s ease-in-out infinite;
            pointer-events: none;
        }

        .corner-tl { top: 10px; left: 10px; }
        .corner-tr { top: 10px; right: 10px; animation-delay: 0.5s; }
        .corner-bl { bottom: 10px; left: 10px; animation-delay: 1s; }
        .corner-br { bottom: 10px; right: 10px; animation-delay: 1.5s; }

        @keyframes twinkle {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.1); }
        }

        /* Mini cuori che escono dalle immagini dopo SÌ */
        .mini-heart-burst {
            position: absolute;
            font-size: 18px;
            pointer-events: none;
            animation: burstOut 1.5s ease-out forwards;
            z-index: 5;
        }

        @keyframes burstOut {
            0% {
                transform: translate(0, 0) scale(0);
                opacity: 1;
            }
            50% {
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(1);
                opacity: 0;
            }
        }

        /* Schermi piccoli */
        @media (max-width: 350px) {
            .container { padding: 20px 15px; }
            h1 { font-size: 1.3em; }
            .animal-img { width: 80px; height: 80px; }
            .heart-between { font-size: 28px; }
            .btn { padding: 15px 40px; font-size: 1.1em; min-width: 170px; }
        }

        /* Schermi grandi */
        @media (min-width: 500px) {
            .container { padding: 40px 35px; }
            h1 { font-size: 1.8em; }
            .animal-img { width: 120px; height: 120px; }
            .buttons { flex-direction: row; justify-content: center; }
        }
    </style>
</head>
<body>
    <!-- Decorazioni angoli -->
    <div class="corner-decoration corner-tl">💕</div>
    <div class="corner-decoration corner-tr">💖</div>
    <div class="corner-decoration corner-bl">💗</div>
    <div class="corner-decoration corner-br">💓</div>

    <!-- Cuoricini fluttuanti -->
    <div class="hearts-container" id="hearts"></div>
    
    <!-- Messaggi quando NO scappa -->
    <div class="escape-message" id="escapeMsg"></div>

    <div class="container">
        <!-- Animali sempre visibili -->
        <div class="animals" id="animals">
            <div class="sparkle-ring sparkle-ring-left"></div>
            <div class="sparkle-ring sparkle-ring-right"></div>
            
            <div class="koala-wrap">
                <img 
                    src="https://i.imgur.com/57Zp6wD.jpeg" 
                    alt="Koala" 
                    class="animal-img"
                >
            </div>
            
            <div class="heart-between" id="heartBetween">💕</div>
            
            <div class="bunny-wrap">
                <img 
                    src="https://i.imgur.com/odRmy9X.jpeg" 
                    alt="Coniglietta" 
                    class="animal-img"
                >
            </div>
        </div>

        <!-- Parte della domanda -->
        <div class="question-content" id="questionContent">
            <h1>
                Ciao amore mio! 💖
                <span class="highlight">Vuoi essere la mia Valentina?</span>
            </h1>
            
            <div class="buttons">
                <button class="btn btn-yes" id="yesBtn">SÌ! 💕</button>
                <button class="btn btn-no" id="noBtn">No...</button>
            </div>
        </div>

        <!-- Parte della celebrazione -->
        <div class="celebration" id="celebration">
            <h2>SIIIII! 🎉🩷🩷🎉</h2>
            <p class="love-text">
                Lo sapevo 🩷<br>
                Ti amo more than tantissimo 🩷<br><br>
                Sarà un San Valentino<br>bellissimo 🩷
            </p>
        </div>
    </div>

    <script>
        // ========== ELEMENTI DOM ==========
        const heartsContainer = document.getElementById('hearts');
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const escapeMsg = document.getElementById('escapeMsg');
        const questionContent = document.getElementById('questionContent');
        const celebration = document.getElementById('celebration');
        const animalsDiv = document.getElementById('animals');
        const heartBetween = document.getElementById('heartBetween');

        // ========== CUORICINI FLUTTUANTI ==========
        const heartEmojis = ['💕', '💖', '💗', '💓', '💝', '❤️', '🩷', '🤍', '💘'];
        let heartsActive = true;
        
        function createHeart() {
            if (!heartsActive) return;
            
            const heart = document.createElement('div');
            heart.className = 'floating-heart';
            heart.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
            heart.style.left = (Math.random() * 96 + 2) + '%';
            
            const duration = 4 + Math.random() * 4;
            heart.style.animationDuration = duration + 's';
            heart.style.fontSize = (16 + Math.random() * 22) + 'px';
            
            // Leggero ondeggiamento orizzontale
            const sway = (Math.random() - 0.5) * 60;
            heart.style.setProperty('--sway', sway + 'px');
            
            heartsContainer.appendChild(heart);
            
            setTimeout(() => {
                if (heart.parentNode) heart.remove();
            }, duration * 1000 + 500);
        }
        
        setInterval(createHeart, 500);
        
        // Cuori iniziali sfalsati
        for (let i = 0; i < 8; i++) {
            setTimeout(createHeart, i * 150);
        }

        // ========== MESSAGGI NO (I TUOI) ==========
        const escapeMessages = [
            "Hey, quel pulsante NO sta scappando 💨",
            "Il NO è un po' timido 🫣",
            "Ops, è scivolato 🤷🏻",
            "Dai su, lo sai che mi ami 🩷",
            "Non è un'opzione valida 😠",
            "Quasi preso! Ma no 😏...",
            "Koalino ti implora...🩷",
            "La coniglietta dice SÌ! 🐰🎀",
            "Quel bottone ha le gambe 🦵🏻",
            "Arrendersi è l'unica via 🩷",
            "Sei veloce, ma lui di più ⚡",
            "Hannika ti odierebbe 🐶"
        ];
        
        const noTexts = [
            "No...", "Nope!", "Mai!", "🏃💨", 
            "Scappo!", "Ahah!", "Ciao!", "Nah!", 
            "❌", "🐰💨", "Prova!", "Troppo lenta!"
        ];
        
        let messageIndex = 0;
        let escapeCount = 0;
        let msgTimeout = null;

        // ========== PULSANTE NO CHE SCAPPA ==========
        function escapeButton(e) {
            if (e) {
                e.preventDefault();
                e.stopPropagation();
                e.stopImmediatePropagation();
            }
            
            escapeCount++;
            
            // Mostra messaggio
            if (msgTimeout) clearTimeout(msgTimeout);
            escapeMsg.textContent = escapeMessages[messageIndex % escapeMessages.length];
            escapeMsg.classList.add('show');
            messageIndex++;
            
            msgTimeout = setTimeout(() => {
                escapeMsg.classList.remove('show');
            }, 2000);
            
            // Nuova posizione random (sempre dentro lo schermo)
            const btnRect = noBtn.getBoundingClientRect();
            const btnW = btnRect.width || 150;
            const btnH = btnRect.height || 50;
            const margin = 25;
            
            const maxX = window.innerWidth - btnW - margin;
            const maxY = window.innerHeight - btnH - margin;
            
            let newX, newY;
            let attempts = 0;
            
            // Evita che appaia troppo vicino al SÌ
            do {
                newX = margin + Math.random() * (maxX - margin);
                newY = 70 + Math.random() * (maxY - 90);
                attempts++;
            } while (attempts < 10 && isNearYesButton(newX, newY));
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = newX + 'px';
            noBtn.style.top = newY + 'px';
            noBtn.style.zIndex = '50';
            noBtn.style.transition = 'none';
            
            // Cambia testo
            noBtn.textContent = noTexts[Math.floor(Math.random() * noTexts.length)];
            
            // Rimpicciolisce dopo tanti tentativi
            if (escapeCount > 5) {
                const scale = Math.max(0.5, 1 - escapeCount * 0.06);
                noBtn.style.transform = 'scale(' + scale + ')';
            }
            
            // Vibrazione mobile
            if (navigator.vibrate) {
                navigator.vibrate(50);
            }
        }
        
        function isNearYesButton(x, y) {
            const yesRect = yesBtn.getBoundingClientRect();
            const dist = Math.hypot(
                x - yesRect.left,
                y - yesRect.top
            );
            return dist < 120;
        }
        
        // Listeners NO
        noBtn.addEventListener('mouseenter', escapeButton);
        noBtn.addEventListener('mouseover', escapeButton);
        noBtn.addEventListener('pointerdown', function(e) {
            e.preventDefault();
            escapeButton(e);
        });
        noBtn.addEventListener('touchstart', function(e) {
            e.preventDefault();
            escapeButton(e);
        }, { passive: false });
        noBtn.addEventListener('click', function(e) {
            e.preventDefault();
            escapeButton(e);
        });

        // ========== PULSANTE SÌ ==========
        let celebrated = false;
        
        function sayYes() {
            if (celebrated) return;
            celebrated = true;
            
            // 1. Nascondi domanda
            questionContent.classList.add('hide');
            noBtn.style.display = 'none';
            escapeMsg.classList.remove('show');
            
            // 2. Avvicina gli animali con animazione
            animalsDiv.classList.add('together');
            heartBetween.textContent = '💕';
            
            // 3. Mini cuori che esplodono dalle immagini
            setTimeout(() => {
                burstHeartsFromAnimals();
            }, 600);
            
            // 4. Mostra celebrazione
            setTimeout(() => {
                celebration.classList.add('show');
            }, 1000);
            
            // 5. Coriandoli!
            setTimeout(() => {
                launchConfetti();
            }, 800);
            
            // 6. Cuori extra
            for (let i = 0; i < 40; i++) {
                setTimeout(createHeart, i * 60);
            }
            
            // 7. Vibrazione celebrativa
            if (navigator.vibrate) {
                navigator.vibrate([100, 50, 100, 50, 200]);
            }
        }
        
        // Listeners SÌ
        yesBtn.addEventListener('click', function(e) {
            e.preventDefault();
            sayYes();
        });
        yesBtn.addEventListener('touchend', function(e) {
            e.preventDefault();
            sayYes();
        });

        // ========== EFFETTI SPECIALI ==========
        
        // Mini cuori che esplodono dal centro
        function burstHeartsFromAnimals() {
            const rect = animalsDiv.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            const miniHearts = ['💕', '💖', '💗', '🩷', '❤️', '💓', '✨'];
            
            for (let i = 0; i < 18; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.className = 'mini-heart-burst';
                    heart.textContent = miniHearts[Math.floor(Math.random() * miniHearts.length)];
                    
                    const angle = (i / 18) * Math.PI * 2;
                    const distance = 60 + Math.random() * 80;
                    const tx = Math.cos(angle) * distance;
                    const ty = Math.sin(angle) * distance;
                    
                    heart.style.left = centerX + 'px';
                    heart.style.top = centerY + 'px';
                    heart.style.setProperty('--tx', tx + 'px');
                    heart.style.setProperty('--ty', ty + 'px');
                    heart.style.position = 'fixed';
                    heart.style.fontSize = (14 + Math.random() * 12) + 'px';
                    
                    document.body.appendChild(heart);
                    
                    setTimeout(() => heart.remove(), 1600);
                }, i * 50);
            }
        }
        
        // Coriandoli
        function launchConfetti() {
            const colors = ['#ff1744', '#ff5252', '#fff', '#ffeb3b', '#ff4081', '#f50057', '#ff80ab', '#e91e63'];
            const shapes = ['❤️', '💕', '💖', '✨', '🎉', '💗', '🩷'];
            
            for (let i = 0; i < 100; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    
                    if (Math.random() > 0.4) {
                        confetti.textContent = shapes[Math.floor(Math.random() * shapes.length)];
                        confetti.style.fontSize = (14 + Math.random() * 22) + 'px';
                    } else {
                        confetti.style.width = (6 + Math.random() * 14) + 'px';
                        confetti.style.height = (6 + Math.random() * 14) + 'px';
                        confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                        confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                    }
                    
                    confetti.style.left = Math.random() * 100 + 'vw';
                    document.body.appendChild(confetti);
                    
                    setTimeout(() => confetti.remove(), 3500);
                }, i * 35);
            }
        }
        
        // Previeni comportamenti indesiderati su mobile
        document.addEventListener('touchmove', function(e) {
            if (e.target.closest('.btn-no')) {
                e.preventDefault();
            }
        }, { passive: false });
    </script>
</body>
</html>
