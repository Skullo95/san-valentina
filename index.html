<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💕 Una domanda per te 💕</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#ff0a3c 0%,#cc0029 50%,#8b0000 100%);
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:'Comic Sans MS','Arial Rounded MT Bold',cursive;
    overflow:hidden;
}

/* CUORI FLUTTUANTI */
.hearts-container{
    position:fixed;
    width:100%;
    height:100%;
    top:0;
    left:0;
    pointer-events:none;
    z-index:0;
}

.floating-heart{
    position:absolute;
    animation:floatUp linear forwards;
    opacity:0.8;
}

@keyframes floatUp{
    from{transform:translateY(100vh);opacity:0;}
    to{transform:translateY(-10vh);opacity:1;}
}

/* Container */
.container{
    position:relative;
    z-index:2;
    background:rgba(255,255,255,0.97);
    border-radius:25px;
    padding:35px;
    text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,0.3);
    max-width:420px;
    width:95%;
    border:4px solid #ff1744;
}

/* Animali */
.animals{
    display:flex;
    justify-content:center;
    align-items:flex-end;
    gap:50px;
    margin-bottom:20px;
    transition:all 1.5s ease;
}

.animals.love{
    gap:10px;
}

.animal-img{
    width:110px;
    transition:transform 1.5s ease;
}

.animals.love .koala-img{
    transform:translateX(20px);
}

.animals.love .bunny-img{
    transform:translateX(-20px);
}

.heart-between{
    font-size:35px;
    animation:pulse 1.5s infinite;
}

@keyframes pulse{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.3);}
}

h1{
    color:#d50000;
    font-size:1.6em;
    margin-bottom:25px;
}

.highlight{
    display:block;
    margin-top:10px;
    font-size:1.2em;
    color:#ff1744;
}

/* Pulsanti */
.buttons{
    display:flex;
    gap:20px;
    justify-content:center;
    flex-wrap:wrap;
}

.btn{
    padding:18px 50px;
    border:none;
    border-radius:50px;
    font-size:1.2em;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

.btn-yes{
    background:linear-gradient(45deg,#ff1744,#ff5252);
    color:white;
}

.btn-yes:hover{
    transform:scale(1.1);
}

.btn-no{
    background:#777;
    color:white;
}

/* Celebrazione */
.celebration{
    display:none;
}

.celebration.show{
    display:block;
}

.question.hide{
    display:none;
}

.love-text{
    color:#d50000;
    font-size:1.1em;
    line-height:1.7;
}
</style>
</head>

<body>

<div class="hearts-container" id="hearts"></div>

<div class="container">

<div class="question" id="question">

<div class="animals" id="animals">
    <img src="images/koala.png" class="animal-img koala-img" alt="Koala">
    <div class="heart-between">💕</div>
    <img src="images/bunny.png" class="animal-img bunny-img" alt="Bunny">
</div>

<h1>
Ciao amore mio 💖
<span class="highlight">Vuoi essere la mia Valentina?</span>
</h1>

<div class="buttons">
<button class="btn btn-yes" id="yesBtn">SÌ! 💕</button>
<button class="btn btn-no" id="noBtn">No...</button>
</div>

</div>

<div class="celebration" id="celebration">
<h1>SIIIII! 🎉🩷</h1>
<p class="love-text">
Lo sapevo 🩷<br>
Ti amo more than tantissimo 🩷<br><br>
Sarà un San Valentino bellissimo 🩷
</p>
</div>

</div>

<!-- MUSICA -->
<audio id="loveMusic" src="music/love.mp3"></audio>

<script>
const yesBtn=document.getElementById("yesBtn");
const noBtn=document.getElementById("noBtn");
const question=document.getElementById("question");
const celebration=document.getElementById("celebration");
const animals=document.getElementById("animals");
const music=document.getElementById("loveMusic");

/* CUORI FLUTTUANTI */
const heartsContainer=document.getElementById("hearts");
const hearts=["💕","💖","💗","💓","🩷"];

function createHeart(){
    const heart=document.createElement("div");
    heart.className="floating-heart";
    heart.innerText=hearts[Math.floor(Math.random()*hearts.length)];
    heart.style.left=Math.random()*100+"vw";
    heart.style.animationDuration=(3+Math.random()*3)+"s";
    heart.style.fontSize=(20+Math.random()*20)+"px";
    heartsContainer.appendChild(heart);
    setTimeout(()=>heart.remove(),5000);
}

setInterval(createHeart,400);

/* CLICK SÌ */
yesBtn.addEventListener("click",()=>{
    question.classList.add("hide");
    celebration.classList.add("show");
    animals.classList.add("love");
    music.play();
});

/* BOTTONE NO CHE SCAPPA */
noBtn.addEventListener("mouseover",()=>{
    const x=Math.random()*window.innerWidth;
    const y=Math.random()*window.innerHeight;
    noBtn.style.position="absolute";
    noBtn.style.left=x+"px";
    noBtn.style.top=y+"px";
});
</script>

</body>
</html>
