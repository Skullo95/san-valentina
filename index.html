<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>💕 Una domanda per te 💕</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            min-height: -webkit-fill-available;
            background: linear-gradient(135deg, #ff0a3c 0%, #cc0029 50%, #8b0000 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Comic Sans MS', 'Chalkboard', 'Arial Rounded MT Bold', cursive;
            overflow-x: hidden;
            padding: 15px;
        }

        /* Cuoricini fluttuanti */
        .hearts-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .floating-heart {
            position: absolute;
            animation: floatUp 4s ease-in infinite;
            opacity: 0.8;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) rotate(0deg) scale(0.5);
                opacity: 0;
            }
            10% {
                opacity: 0.8;
            }
            90% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-100px) rotate(360deg) scale(1);
                opacity: 0;
            }
        }

        /* Container principale */
        .container {
            background: rgba(255, 255, 255, 0.97);
            border-radius: 25px;
            padding: 30px 25px;
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.3),
                0 0 40px rgba(255, 255, 255, 0.2),
                inset 0 0 30px rgba(255, 192, 203, 0.2);
            text-align: center;
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 400px;
            border: 4px solid #ff1744;
        }

        /* Animali carini */
        .animals {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 10px;
            margin-bottom: 15px;
        }

        .koala {
            font-size: 65px;
            animation: bounce 2s ease-in-out infinite;
            filter: drop-shadow(3px 3px 6px rgba(0,0,0,0.3));
        }

        .bunny-container {
            position: relative;
            animation: bounce 2s ease-in-out infinite 0.3s;
        }

        .bunny {
            font-size: 65px;
            filter: drop-shadow(3px 3px 6px rgba(0,0,0,0.3));
        }

        .bow {
            position: absolute;
            top: -8px;
            right: 0px;
            font-size: 28px;
            transform: rotate(15deg);
            filter: drop-shadow(1px 1px 2px rgba(0,0,0,0.3));
        }

        .heart-between {
            font-size: 35px;
            animation: pulse 1s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.4); }
        }

        /* Testo */
        h1 {
            color: #d50000;
            font-size: 1.5em;
            margin-bottom: 25px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
            line-height: 1.5;
        }

        .highlight {
            color: #ff1744;
            font-size: 1.15em;
            display: block;
            margin-top: 10px;
        }

        /* Pulsanti */
        .buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
            min-height: 130px;
            align-items: center;
        }

        .btn {
            padding: 18px 60px;
            font-size: 1.3em;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 6px 25px rgba(0,0,0,0.25);
            min-width: 200px;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
        }

        .btn-yes {
            background: linear-gradient(45deg, #ff1744, #ff5252, #ff1744);
            background-size: 200% 200%;
            animation: gradientShift 2s ease infinite;
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .btn-yes:hover, .btn-yes:active {
            transform: scale(1.1);
            box-shadow: 0 10px 40px rgba(255, 23, 68, 0.5);
        }

        .btn-no {
            background: linear-gradient(45deg, #9e9e9e, #757575);
            color: white;
            font-size: 1.1em;
            padding: 15px 50px;
        }

        /* Celebrazione */
        .celebration {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .celebration.show {
            display: block;
        }

        .question {
            transition: opacity 0.3s ease;
        }

        .question.hide {
            display: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        .celebration h1 {
            font-size: 2em;
            margin-bottom: 15px;
            color: #d50000;
        }

        .celebration-animals {
            font-size: 70px;
            margin: 15px 0;
            animation: celebrateBounce 0.5s ease infinite;
        }

        @keyframes celebrateBounce {
            0%, 100% { transform: scale(1) rotate(-2deg); }
            50% { transform: scale(1.05) rotate(2deg); }
        }

        .love-text {
            font-size: 1.1em;
            color: #d50000;
            margin-top: 15px;
            line-height: 1.8;
        }

        /* Coriandoli */
        .confetti {
            position: fixed;
            animation: confettiFall 3s ease-in-out forwards;
            z-index: 1000;
            pointer-events: none;
        }

        @keyframes confettiFall {
            0% {
                transform: translateY(-20px) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* Messaggio quando il NO scappa */
        .escape-message {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            color: #d50000;
            padding: 12px 20px;
            border-radius: 25px;
            font-size: 0.95em;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 100;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            max-width: 90%;
            text-align: center;
            border: 2px solid #ff1744;
            font-weight: bold;
            pointer-events: none;
        }

        .escape-message.show {
            opacity: 1;
        }

        /* Decorazioni angoli */
        .corner-decoration {
            position: fixed;
            font-size: 40px;
            opacity: 0.6;
            z-index: 0;
            animation: twinkle 2s ease-in-out infinite;
            pointer-events: none;
        }

        .corner-tl { top: 10px; left: 10px; }
        .corner-tr { top: 10px; right: 10px; animation-delay: 0.5s; }
        .corner-bl { bottom: 10px; left: 10px; animation-delay: 1s; }
        .corner-br { bottom: 10px; right: 10px; animation-delay: 1.5s; }

        @keyframes twinkle {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.1); }
        }

        /* Media queries per schermi molto piccoli */
        @media (max-width: 350px) {
            .container {
                padding: 20px 15px;
            }
            
            h1 {
                font-size: 1.3em;
            }
            
            .koala, .bunny {
                font-size: 50px;
            }
            
            .heart-between {
                font-size: 28px;
            }
            
            .btn {
                padding: 15px 40px;
                font-size: 1.1em;
                min-width: 170px;
            }
        }

        /* Per schermi più grandi */
        @media (min-width: 500px) {
            .container {
                padding: 40px 35px;
            }
            
            h1 {
                font-size: 1.8em;
            }
            
            .koala, .bunny {
                font-size: 80px;
            }
            
            .buttons {
                flex-direction: row;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <!-- Decorazioni angoli -->
    <div class="corner-decoration corner-tl">💕</div>
    <div class="corner-decoration corner-tr">💖</div>
    <div class="corner-decoration corner-bl">💗</div>
    <div class="corner-decoration corner-br">💓</div>

    <!-- Cuoricini fluttuanti -->
    <div class="hearts-container" id="hearts"></div>
    
    <!-- Messaggi quando NO scappa -->
    <div class="escape-message" id="escapeMsg"></div>

    <div class="container">
        <!-- Parte della domanda -->
        <div class="question" id="question">
            <div class="animals">
                <div class="koala">🐨</div>
                <div class="heart-between">💕</div>
                <div class="bunny-container">
                    <div class="bunny">🐰</div>
                    <div class="bow">🎀</div>
                </div>
            </div>
            
            <h1>
                Ciao amore mio! 💖
                <span class="highlight">Vuoi essere la mia Valentina?</span>
            </h1>
            
            <div class="buttons">
                <button class="btn btn-yes" id="yesBtn">SÌ! 💕</button>
                <button class="btn btn-no" id="noBtn">No...</button>
            </div>
        </div>

        <!-- Parte della celebrazione -->
        <div class="celebration" id="celebration">
            <h1>SIIIII! 🎉🩷🩷🎉</h1>
            <div class="celebration-animals">
                🐨🩷🐰🎀
            </div>
            <p class="love-text">
                Lo sapevo 🩷<br>
                Ti amo more than tantissimo 🩷<br><br>
                Sarà un San Valentino<br>bellissimo 🩷
            </p>
        </div>
    </div>

    <script>
        // Elementi DOM
        const heartsContainer = document.getElementById('hearts');
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const escapeMsg = document.getElementById('escapeMsg');
        const question = document.getElementById('question');
        const celebration = document.getElementById('celebration');

        // Cuoricini fluttuanti
        const heartEmojis = ['💕', '💖', '💗', '💓', '💝', '❤️', '🩷', '🤍', '💘'];
        
        function createHeart() {
            const heart = document.createElement('div');
            heart.className = 'floating-heart';
            heart.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (3 + Math.random() * 3) + 's';
            heart.style.fontSize = (18 + Math.random() * 25) + 'px';
            heartsContainer.appendChild(heart);
            
            setTimeout(() => heart.remove(), 6000);
        }
        
        setInterval(createHeart, 400);
        
        // Cuori iniziali
        for(let i = 0; i < 5; i++) {
            setTimeout(createHeart, i * 200);
        }

        // I TUOI messaggi divertenti (corretti)
        const escapeMessages = [
            "Hey, quel pulsante NO sta scappando 💨",
            "Il NO è un po' timido 🫣",
            "Ops, è scivolato 🤷🏻",
            "Dai su, lo sai che mi ami 🩷",
            "Non è un'opzione valida 😠",
            "Quasi preso! Ma no 😏...",
            "Koalino ti implora...🩷",
            "La coniglietta dice SÌ! 🐰🎀",
            "Quel bottone ha le gambe 🦵🏻",
            "Arrendersi è l'unica via 🩷",
            "Sei veloce, ma lui di più ⚡",
            "Hannika ti odierebbe 🐶"
        ];
        
        let messageIndex = 0;
        let escapeCount = 0;
        
        // Funzione per far scappare il NO
        function escapeButton(e) {
            if(e) {
                e.preventDefault();
                e.stopPropagation();
            }
            
            escapeCount++;
            
            // Mostra messaggio divertente
            escapeMsg.textContent = escapeMessages[messageIndex % escapeMessages.length];
            escapeMsg.classList.add('show');
            messageIndex++;
            
            setTimeout(() => escapeMsg.classList.remove('show'), 1800);
            
            // Calcola nuova posizione sicura
            const btnWidth = noBtn.offsetWidth || 150;
            const btnHeight = noBtn.offsetHeight || 50;
            const padding = 30;
            
            const maxX = window.innerWidth - btnWidth - padding;
            const maxY = window.innerHeight - btnHeight - padding;
            
            let newX = padding + Math.random() * (maxX - padding);
            let newY = 80 + Math.random() * (maxY - 120);
            
            // Assicurati che non vada fuori schermo
            newX = Math.max(padding, Math.min(newX, maxX));
            newY = Math.max(80, Math.min(newY, maxY));
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = newX + 'px';
            noBtn.style.top = newY + 'px';
            noBtn.style.zIndex = '50';
            
            // Testi divertenti per il pulsante NO
            const noTexts = ["No...", "Nope!", "Mai!", "🏃💨", "Scappo!", "Ahah!", "Ciao!", "Nah!", "❌", "🐰💨"];
            noBtn.textContent = noTexts[Math.floor(Math.random() * noTexts.length)];
            
            // Dopo molti tentativi, diventa più piccolo
            if(escapeCount > 5) {
                const scale = Math.max(0.6, 1 - escapeCount * 0.05);
                noBtn.style.transform = `scale(${scale})`;
            }
            
            // Vibrazione su mobile
            if(navigator.vibrate) {
                navigator.vibrate(50);
            }
        }
        
        // Event listeners per il pulsante NO (mobile + desktop)
        noBtn.addEventListener('mouseenter', escapeButton);
        noBtn.addEventListener('mouseover', escapeButton);
        noBtn.addEventListener('touchstart', function(e) {
            e.preventDefault();
            escapeButton(e);
        }, {passive: false});
        noBtn.addEventListener('click', function(e) {
            e.preventDefault();
            escapeButton(e);
        });

        // Celebrazione quando clicca SÌ
        function sayYes() {
            question.classList.add('hide');
            celebration.classList.add('show');
            noBtn.style.display = 'none';
            
            // Vibrazione celebrativa
            if(navigator.vibrate) {
                navigator.vibrate([100, 50, 100, 50, 200]);
            }
            
            // Lancia coriandoli!
            launchConfetti();
            
            // Più cuori!
            for(let i = 0; i < 30; i++) {
                setTimeout(createHeart, i * 80);
            }
        }
        
        // Event listeners per il pulsante SÌ (mobile + desktop)
        yesBtn.addEventListener('click', function(e) {
            e.preventDefault();
            sayYes();
        });
        yesBtn.addEventListener('touchend', function(e) {
            e.preventDefault();
            sayYes();
        });
        
        // Coriandoli
        function launchConfetti() {
            const colors = ['#ff1744', '#ff5252', '#fff', '#ffeb3b', '#ff4081', '#f50057', '#ff80ab'];
            const shapes = ['❤️', '💕', '💖', '✨', '🎉', '💗', '🩷'];
            
            for(let i = 0; i < 80; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    
                    if(Math.random() > 0.5) {
                        confetti.textContent = shapes[Math.floor(Math.random() * shapes.length)];
                        confetti.style.fontSize = (15 + Math.random() * 20) + 'px';
                    } else {
                        confetti.style.width = (8 + Math.random() * 12) + 'px';
                        confetti.style.height = (8 + Math.random() * 12) + 'px';
                        confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                        confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                    }
                    
                    confetti.style.left = Math.random() * 100 + 'vw';
                    document.body.appendChild(confetti);
                    
                    setTimeout(() => confetti.remove(), 3000);
                }, i * 40);
            }
        }
        
        // Previeni comportamenti indesiderati su mobile
        document.addEventListener('touchmove', function(e) {
            if(e.target.closest('.btn-no')) {
                e.preventDefault();
            }
        }, {passive: false});
    </script>
</body>
</html>
