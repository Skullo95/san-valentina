<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💕 Una domanda per te 💕</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 50%, #ffecd2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Comic Sans MS', 'Chalkboard', cursive;
            overflow: hidden;
        }

        /* Cuoricini fluttuanti */
        .hearts-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .floating-heart {
            position: absolute;
            font-size: 20px;
            animation: floatUp 4s ease-in infinite;
            opacity: 0.7;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.7;
            }
            90% {
                opacity: 0.7;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        /* Container principale */
        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            padding: 40px 50px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            text-align: center;
            position: relative;
            z-index: 1;
            max-width: 500px;
            border: 3px solid #ffb6c1;
        }

        /* Animali carini */
        .animals {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 20px;
            margin-bottom: 20px;
        }

        .koala {
            font-size: 80px;
            animation: bounce 2s ease-in-out infinite;
            filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.2));
        }

        .bunny-container {
            position: relative;
            animation: bounce 2s ease-in-out infinite 0.3s;
        }

        .bunny {
            font-size: 80px;
            filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.2));
        }

        .bow {
            position: absolute;
            top: -5px;
            right: 5px;
            font-size: 30px;
            transform: rotate(15deg);
        }

        .heart-between {
            font-size: 40px;
            animation: pulse 1s ease-in-out infinite;
            color: #ff6b9d;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.3); }
        }

        /* Testo */
        h1 {
            color: #e75480;
            font-size: 2.2em;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            line-height: 1.4;
        }

        .highlight {
            color: #ff1493;
            font-size: 1.2em;
        }

        /* Pulsanti */
        .buttons {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 20px;
            min-height: 80px;
            align-items: center;
        }

        .btn {
            padding: 15px 50px;
            font-size: 1.4em;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        .btn-yes {
            background: linear-gradient(45deg, #ff6b9d, #ff8e53);
            color: white;
        }

        .btn-yes:hover {
            transform: scale(1.15);
            box-shadow: 0 8px 30px rgba(255, 107, 157, 0.5);
        }

        .btn-no {
            background: linear-gradient(45deg, #a8a8a8, #888);
            color: white;
            position: relative;
        }

        .btn-no:hover {
            background: linear-gradient(45deg, #888, #666);
        }

        /* Celebrazione */
        .celebration {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .celebration.show {
            display: block;
        }

        .question {
            transition: opacity 0.3s ease;
        }

        .question.hide {
            display: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        .celebration h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        .celebration-animals {
            font-size: 100px;
            margin: 20px 0;
        }

        .love-text {
            font-size: 1.3em;
            color: #e75480;
            margin-top: 20px;
        }

        /* Coriandoli */
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: #ff6b9d;
            animation: confettiFall 3s ease-in-out forwards;
            z-index: 1000;
        }

        @keyframes confettiFall {
            0% {
                transform: translateY(-100px) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* Messaggio quando il NO scappa */
        .escape-message {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 107, 157, 0.9);
            color: white;
            padding: 10px 25px;
            border-radius: 25px;
            font-size: 1em;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 100;
        }

        .escape-message.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <!-- Cuoricini fluttuanti -->
    <div class="hearts-container" id="hearts"></div>
    
    <!-- Messaggi quando NO scappa -->
    <div class="escape-message" id="escapeMsg">Ehi, quel pulsante non vuole essere cliccato! 😜</div>

    <div class="container">
        <!-- Parte della domanda -->
        <div class="question" id="question">
            <div class="animals">
                <div class="koala">🐨</div>
                <div class="heart-between">💕</div>
                <div class="bunny-container">
                    <div class="bunny">🐰</div>
                    <div class="bow">🎀</div>
                </div>
            </div>
            
            <h1>
                Ciao amore mio! 💖<br>
                <span class="highlight">Vuoi essere la mia Valentina?</span>
            </h1>
            
            <div class="buttons">
                <button class="btn btn-yes" onclick="sayYes()">SÌ! 💕</button>
                <button class="btn btn-no" id="noBtn" onmouseover="escapeButton()" onclick="escapeButton()">No...</button>
            </div>
        </div>

        <!-- Parte della celebrazione -->
        <div class="celebration" id="celebration">
            <h1>YEEEE! 🎉💕🎉</h1>
            <div class="celebration-animals">
                🐨💕🐰🎀
            </div>
            <p class="love-text">
                Lo sapevo! 💖<br>
                Ti amo tantissimo! 🥰<br>
                Sarà il San Valentino più bello di sempre!
            </p>
        </div>
    </div>

    <script>
        // Crea cuoricini fluttuanti
        const heartsContainer = document.getElementById('hearts');
        const heartEmojis = ['💕', '💖', '💗', '💓', '💝', '❤️', '🩷'];
        
        function createHeart() {
            const heart = document.createElement('div');
            heart.className = 'floating-heart';
            heart.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (3 + Math.random() * 3) + 's';
            heart.style.fontSize = (15 + Math.random() * 20) + 'px';
            heartsContainer.appendChild(heart);
            
            setTimeout(() => heart.remove(), 6000);
        }
        
        setInterval(createHeart, 300);

        // Messaggi divertenti quando NO scappa
        const escapeMessages = [
            "Ehi, quel pulsante non vuole essere cliccato! 😜",
            "Il NO è timido, scappa! 🏃‍♂️",
            "Ops! Il pulsante è scivolato! 😂",
            "Dai su, lo sai che mi ami! 💕",
            "Il NO dice: 'Non sono un'opzione!' 🙅",
            "Quasi! Ma no. 😏",
            "Il koala ti prega... scegli SÌ! 🐨💕",
            "La coniglietta vuole un SÌ! 🐰🎀",
            "Quel pulsante ha le gambe! 🦵",
            "Arrendersi è l'unica opzione! 💖"
        ];
        let messageIndex = 0;
        
        const noBtn = document.getElementById('noBtn');
        const escapeMsg = document.getElementById('escapeMsg');
        
        function escapeButton() {
            // Mostra messaggio divertente
            escapeMsg.textContent = escapeMessages[messageIndex % escapeMessages.length];
            escapeMsg.classList.add('show');
            messageIndex++;
            
            setTimeout(() => escapeMsg.classList.remove('show'), 1500);
            
            // Sposta il pulsante in posizione random
            const container = document.querySelector('.container');
            const containerRect = container.getBoundingClientRect();
            
            const maxX = window.innerWidth - 150;
            const maxY = window.innerHeight - 80;
            
            let newX = Math.random() * maxX;
            let newY = Math.random() * maxY;
            
            // Evita che vada troppo fuori schermo
            newX = Math.max(20, Math.min(newX, maxX - 20));
            newY = Math.max(60, Math.min(newY, maxY - 20));
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = newX + 'px';
            noBtn.style.top = newY + 'px';
            noBtn.style.zIndex = '50';
            noBtn.style.transition = 'all 0.2s ease';
            
            // A volte cambia anche il testo del NO
            const noTexts = ["No...", "Nope!", "Mai!", "🏃💨", "Catch me!", "Scappo!", "Ahah!"];
            noBtn.textContent = noTexts[Math.floor(Math.random() * noTexts.length)];
        }

        // Celebrazione quando clicca SÌ
        function sayYes() {
            document.getElementById('question').classList.add('hide');
            document.getElementById('celebration').classList.add('show');
            noBtn.style.display = 'none';
            
            // Lancia coriandoli!
            launchConfetti();
            
            // Più cuori!
            for(let i = 0; i < 20; i++) {
                setTimeout(createHeart, i * 100);
            }
        }
        
        function launchConfetti() {
            const colors = ['#ff6b9d', '#ff8e53', '#ffd700', '#ff69b4', '#87ceeb', '#98fb98', '#dda0dd'];
            
            for(let i = 0; i < 100; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + 'vw';
                    confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.width = (5 + Math.random() * 10) + 'px';
                    confetti.style.height = (5 + Math.random() * 10) + 'px';
                    confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                    document.body.appendChild(confetti);
                    
                    setTimeout(() => confetti.remove(), 3000);
                }, i * 30);
            }
        }
    </script>
</body>
</html>
